# Reconstruit le site (docs/) à chaque modification poussée sur main,
# par exemple quand un chef dépose une annale depuis l'interface de GitHub.
name: Construire le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - name: Enregistrer docs/ si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Rien à mettre à jour."
          else
            git commit -m "Reconstruction du site"
            git push
          fi
